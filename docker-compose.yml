# =============================================================================
# LeadLock AI — Docker Compose (Full Stack)
# =============================================================================
# Usage:
#   docker compose up -d            # Start all services
#   docker compose up -d --build    # Rebuild and start
#   docker compose logs -f          # Follow logs

services:
  # ===== PostgreSQL =====
  postgres:
    image: postgres:16-alpine
    container_name: leadlock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadlock
      POSTGRES_PASSWORD: leadlock_secret
      POSTGRES_DB: leadlock
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadlock"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: leadlock-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ===== FastAPI Edge Worker =====
  edge-worker:
    build:
      context: ./leadlock_BE
      dockerfile: Dockerfile
    container_name: leadlock-edge-worker
    restart: unless-stopped
    command: >
      uvicorn edge_worker.main:app
      --host 0.0.0.0 --port 8001
      --workers 2 --loop uvloop
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://leadlock:leadlock_secret@postgres:5432/leadlock
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENWA_BASE_URL: http://openwa-api:2785
      EDGE_WORKER_PORT: "8001"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===== FastAPI Core Service =====
  core-api:
    build:
      context: ./leadlock_BE
      dockerfile: Dockerfile
    container_name: leadlock-core-api
    restart: unless-stopped
    command: >
      uvicorn core_service.main:app
      --host 0.0.0.0 --port 8000
      --workers 2 --loop uvloop
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://leadlock:leadlock_secret@postgres:5432/leadlock
      REDIS_URL: redis://redis:6379/0
      CORE_SERVICE_PORT: "8000"
      CORS_ORIGINS: http://localhost:3000,http://frontend:3000
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===== Next.js Dashboard =====
  frontend:
    build:
      context: ./leadlock_FE
      dockerfile: Dockerfile
    container_name: leadlock-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      - core-api

  # ===== OpenWA Gateway (existing service) =====
  openwa-api:
    build:
      context: ./OpenWA-Internal
      dockerfile: Dockerfile
    container_name: leadlock-openwa
    restart: unless-stopped
    ports:
      - "127.0.0.1:2785:2785"
    environment:
      NODE_ENV: production
      PORT: "2785"
      DATABASE_TYPE: sqlite
      DATABASE_NAME: /app/data/openwa.sqlite
      REDIS_ENABLED: "false"
      WEBHOOK_TIMEOUT: "10000"
      WEBHOOK_MAX_RETRIES: "3"
    volumes:
      - openwa-data:/app/data

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  openwa-data:
    driver: local

networks:
  default:
    name: leadlock-network
